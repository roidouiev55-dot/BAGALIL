  #c{position:fixed;inset:0;display:block;touch-action:none}

     background:#FBF7F0;z-index:50;transition:opacity .5s ease}
  #boot.gone{opacity:0;pointer-events:none}
  .bootDot{width:9px;height:9px;border-radius:50%;background:var(--pink);opacity:.35;
     animation:bd 1.1s ease-in-out infinite}
  .bootDot:nth-child(2){animation-delay:.15s}
  .bootDot:nth-child(3){animation-delay:.3s}
  @keyframes bd{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
  #nogl{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;
     justify-content:center;gap:14px;padding:28px;text-align:center;background:#FBF7F0}
  #nogl.on{display:flex}
  #nogl h1{font-family:'Frank Ruhl Libre',serif;color:var(--pink);font-size:clamp(26px,7vw,44px)}
  #nogl p{font-family:'Heebo',sans-serif;color:rgba(229,72,159,.75);letter-spacing:3px;font-size:15px}
  .nglBtns{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:min(320px,86vw)}
  .nglBtn{font-family:'Heebo',sans-serif;font-weight:700;text-decoration:none;text-align:center;
     background:var(--pink);color:#fff;padding:15px 22px;border-radius:999px;
     box-shadow:0 10px 28px rgba(229,72,159,.3)}
  .nglBtn.alt{background:rgba(255,255,255,.9);color:var(--pink);border:1.6px solid var(--pink);box-shadow:none}
  @media (prefers-reduced-motion: reduce){
    .ripple i{animation:none;opacity:.45;transform:scale(1)}
    .bootDot{animation:none}
  }
  #washTop{position:fixed;top:0;left:0;right:0;height:38vh;pointer-events:none;
     background:linear-gradient(180deg, rgba(255,246,232,.85) 0%, rgba(255,246,232,.5) 55%, rgba(255,246,232,0) 100%);z-index:1}
  #washBot{position:fixed;bottom:0;left:0;right:0;height:32vh;pointer-events:none;
     background:linear-gradient(0deg, rgba(255,240,222,.75) 0%, rgba(255,240,222,.35) 60%, rgba(255,240,222,0) 100%);z-index:1}
  #vig{position:fixed;inset:0;pointer-events:none;
     background:radial-gradient(70% 60% at 50% 42%, rgba(255,250,242,.92) 0%, rgba(255,250,242,.62) 38%, rgba(255,250,242,.15) 72%, rgba(255,250,242,0) 92%),
                radial-gradient(120% 110% at 50% 45%, rgba(0,0,0,0) 52%, rgba(120,80,60,.16) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(60% 55% at 50% 45%, rgba(255,255,255,.95), rgba(255,214,238,.55) 45%, rgba(255,214,238,0) 75%);
     transition:opacity .12s ease-out}
  #ui{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;
     padding:calc(6vh + env(safe-area-inset-top)) 20px 0;pointer-events:none;text-align:center;
     transition:padding-top .9s cubic-bezier(.2,.8,.3,1)}
  #ui.low{padding-top:calc(15vh + env(safe-area-inset-top))}
  #tag{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--pink);
     font-size:clamp(30px,7.2vw,60px);line-height:1.12;letter-spacing:-0.5px;
     opacity:0;transform:translateY(-10px);transition:opacity 1.1s ease,transform 1.1s ease;
     text-shadow:0 0 2px rgba(255,252,246,1), 0 2px 12px rgba(255,252,246,.98), 0 4px 34px rgba(255,252,246,.9)}
  #sub{font-family:'Heebo',sans-serif;font-weight:500;color:rgba(229,72,159,.78);
     font-size:clamp(13px,3.4vw,17px);letter-spacing:3px;margin-top:14px;
     opacity:0;transform:translateY(-6px);transition:opacity 1s ease .35s,transform 1s ease .35s}
  #sub.show{opacity:1;transform:none}
  #tag.show{opacity:1;transform:none}
  .badge{position:fixed;left:0;top:0;transform:translate(-50%,-50%) scale(.9);opacity:0;
     pointer-events:none;display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;cursor:pointer;
     background:rgba(255,255,255,.92);border:1.5px solid rgba(229,72,159,.35);
     padding:6px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(229,72,159,.22);white-space:nowrap;
     backdrop-filter:blur(6px);
     transition:opacity .7s ease,transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .badge.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .badge.hot{transform:translate(-50%,-50%) scale(1.07)}
  .badge b{font-family:'Heebo',sans-serif;font-weight:700;color:var(--pink);font-size:clamp(14px,3.7vw,17px);line-height:1}
  .badge span{font-family:'Heebo',sans-serif;font-weight:500;color:rgba(229,72,159,.7);font-size:clamp(11px,2.9vw,13px);line-height:1}

  .ripple{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
     width:1px;height:1px;transition:opacity .8s ease}
  .ripple.on{opacity:1}
  .ripple i{position:absolute;left:50%;top:50%;width:var(--rs,120px);height:var(--rs,120px);
     margin-left:calc(var(--rs,120px)/-2);margin-top:calc(var(--rs,120px)/-2);
     border:2px solid rgba(229,72,159,.55);border-radius:50%;
     animation:rip 2.8s cubic-bezier(.2,.7,.3,1) infinite}
  .ripple i:nth-child(2){animation-delay:1.4s}
  @keyframes rip{
    0%{transform:scale(.62);opacity:0}
    18%{opacity:.75}
    100%{transform:scale(1.42);opacity:0}
  }

// ---------- renderer ----------
const canvas=document.getElementById('c');
// --- no-WebGL fallback: show a clean static page instead of a blank screen ---
(()=>{
  let ok=false;
  try{ const t=document.createElement('canvas');
    ok=!!(window.WebGLRenderingContext && (t.getContext('webgl2')||t.getContext('webgl'))); }catch(e){}
  if(!ok){
    document.getElementById('nogl').classList.add('on');
    document.getElementById('boot').classList.add('gone');
    throw new Error('[BAGLIL] WebGL unavailable — static fallback shown');
  }
})();
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const CAM_BASE=4.4;
const camera=new THREE.PerspectiveCamera(40,1,0.1,100); camera.position.set(0,0.25,CAM_BASE);
const root=new THREE.Group(); scene.add(root);   // everything lives here so it can be scaled to fit
scene.fog=new THREE.Fog(0xF6EFE4, 6.0, 15.0);    // far particles melt into the warm background

// ---------- environment (HDRI parsed directly: no Worker) ----------
const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
try{ scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture; }catch(e){}
// warm studio environment generated in code — same warmth, zero download
(()=>{
  const w=512,h=256,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,'#FFFFFF');
  g.addColorStop(0.32,'#FFF4E6');
  g.addColorStop(0.60,'#F8E9DC');
  g.addColorStop(1.00,'#E9D9CD');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const k=x.createRadialGradient(w*0.30,h*0.20,0,w*0.30,h*0.20,h*0.60);
  k.addColorStop(0,'rgba(255,255,255,1)'); k.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=k; x.fillRect(0,0,w,h);
  const p=x.createRadialGradient(w*0.76,h*0.74,0,w*0.76,h*0.74,h*0.65);
  p.addColorStop(0,'rgba(255,192,226,0.55)'); p.addColorStop(1,'rgba(255,192,226,0)');
  x.fillStyle=p; x.fillRect(0,0,w,h);
  const q=x.createRadialGradient(w*0.08,h*0.60,0,w*0.08,h*0.60,h*0.7);
  q.addColorStop(0,'rgba(255,224,196,0.5)'); q.addColorStop(1,'rgba(255,224,196,0)');
  x.fillStyle=q; x.fillRect(0,0,w,h);
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.needsUpdate=true;
  scene.environment=pmrem.fromEquirectangular(tex).texture;
  tex.dispose();
  console.log('[BAGLIL] procedural warm environment ready (no HDRI download)');
})();

// ------- SKY (200 units out) — golden-hour gradient, moves slowest with scroll -------
const skyGroup=new THREE.Group(); spaceRoot.add(skyGroup);
(function buildSky(){
  const w=1024,h=512,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,'#F4C58A');   // upper warm
  g.addColorStop(0.35,'#F9D8A6');
  g.addColorStop(0.65,'#F7C09A');   // horizon glow
  g.addColorStop(1.00,'#C88B7C');   // lower dust
  x.fillStyle=g; x.fillRect(0,0,w,h);
  // sun bloom, off-centre so rotation reveals it
  const sun=x.createRadialGradient(w*0.72,h*0.42,0,w*0.72,h*0.42,h*0.6);
  sun.addColorStop(0,'rgba(255,240,200,0.9)');
  sun.addColorStop(0.35,'rgba(255,220,170,0.4)');
  sun.addColorStop(1,'rgba(255,220,170,0)');
  x.fillStyle=sun; x.fillRect(0,0,w,h);
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=THREE.RepeatWrapping;
  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(200,64,40),
    new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false,depthWrite:false})
  );
  sphere.renderOrder=-4;
  skyGroup.add(sphere);
})();

// ------- FAR LAYER — Galilee drone video as a 3D depth plane -------
// video is served as an external file (galilee.mp4) alongside index.html;
// NOT base64-embedded (would balloon the page to ~11MB — mobile red flag).
// Uses VideoTexture on a Plane so it composites correctly with our foreground 3D layers,
// not a DOM <video> element (that would break z-ordering with WebGL).
const farGroup=new THREE.Group(); spaceRoot.add(farGroup);
(function buildVideoBackdrop(){
  const vid=document.createElement('video');
  vid.src='galilee.mp4';
  vid.loop=true;
  vid.muted=true;                    // iOS requires muted for autoplay
  vid.playsInline=true;              // without this iOS opens fullscreen
  vid.autoplay=true;
  vid.crossOrigin='anonymous';
  vid.setAttribute('webkit-playsinline','');
  vid.play().catch(err=>console.warn('[BAGLIL] video autoplay blocked:',err));
  // if the file is missing or the codec is unsupported, hide the plane so the sky shows through
  vid.addEventListener('error',()=>{
    console.warn('[BAGLIL] video failed to load — falling back to sky');
    if(farGroup.userData.plane) farGroup.userData.plane.visible=false;
  });

  const tex=new THREE.VideoTexture(vid);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearFilter;
  tex.magFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;

  // wide 16:9 plane in front of the sky, behind foreground droplets/shafts/motes.
  // sized generously so it fills the field of view on any mobile viewport.
  const W=180, H=W*(9/16);
  const plane=new THREE.Mesh(
    new THREE.PlaneGeometry(W,H,1,1),
    new THREE.MeshBasicMaterial({
      map:tex,
      // brightness/saturation reduction happens through vertex colors + a scrim overlay
      // (WebGL MeshBasic has no built-in filters — the scrim layer handles the wash)
      fog:false,
      depthWrite:false,
      toneMapped:false
    })
  );
  plane.position.set(0, 4, -55);
  plane.renderOrder=-3;
  farGroup.add(plane);

  // subtle Z drift with scroll — the video already moves forward, so we push the plane
  // gently in and out along Z to reinforce "we're moving too" without fighting its motion
  farGroup.userData.plane=plane;
  console.log('[BAGLIL] video backdrop plane installed');
})();

function makeShape(s){

  sh.moveTo(o[0][0],o[0][1]); for(let i=1;i<o.length;i++) sh.lineTo(o[i][0],o[i][1]); sh.closePath();
  for(const hole of s.holes){ const p=new THREE.Path(); p.moveTo(hole[0][0],hole[0][1]);
    for(let i=1;i<hole.length;i++) p.lineTo(hole[i][0],hole[i][1]); p.closePath(); sh.holes.push(p); }

}

const N=14000;
function rand(a,b){return a+Math.random()*(b-a);}
// generic area-weighted surface sampler over a list of {geo, matrix}
function sampleSurfaces(items, n){
  const out=new Float32Array(n*3);
  const tris=[]; let total=0;
  const vA=new THREE.Vector3(),vB=new THREE.Vector3(),vC=new THREE.Vector3(),ab=new THREE.Vector3(),ac=new THREE.Vector3(),cr=new THREE.Vector3();
  for(const it of items){
    const g=it.geo, pos=g.attributes.position, idx=g.index;
    const count = idx? idx.count : pos.count;
    for(let i=0;i<count;i+=3){

      vA.fromBufferAttribute(pos,a); vB.fromBufferAttribute(pos,b); vC.fromBufferAttribute(pos,c);

function outlineShape(sh,inset){

  const s=targetH/Math.max(sz.x,sz.y);
  const local=new THREE.Matrix4().makeScale(s,-s,s)
    .multiply(new THREE.Matrix4().makeTranslation(-c.x,-c.y,-c.z));

  meshes.forEach(m=>{ m.applyMatrix4(local); m.updateMatrix(); grp.add(m); });

  }

      tagEl.textContent = wantEnd ? 'אל תפספסו את האירוע הבא' : 'האירועים הכי שווים בגליל';
      subEl.textContent = wantEnd ? 'בחרו איך להצטרף'        : 'יין | מוזיקה | חופש';
      tagEl.classList.add('show'); subEl.classList.add('show');
    },420);
  }

  // ---- particle positions ----
  if(partOp>0.01){
    const p=pGeo.attributes.position.array;
    for(let k=0;k<N;k++){ const j=k*3;
      let x=A[j]+(B[j]-A[j])*mt, y=A[j+1]+(B[j+1]-A[j+1])*mt, z=A[j+2]+(B[j+2]-A[j+2])*mt;
      if(turbAmp){ x+=turb[j]*turbAmp; y+=turb[j+1]*turbAmp; z+=turb[j+2]*turbAmp; }
      p[j]=x; p[j+1]=y; p[j+2]=z;
    }
    pGeo.attributes.position.needsUpdate=true;
  }

  // ---- motion ----
  px+=(tx-px)*0.06; py+=(ty-py)*0.06;

  // (2) slow cinematic camera push over the first ~9s
  const pushT=REDUCED?1:P;
  camera.position.z = CAM_BASE + 0.95*(1-pushT*pushT*(3-2*pushT));
  camera.position.x = px*0.4; camera.position.y = 0.25 - py*0.3;
  camera.lookAt(0,root.position.y*0.5,0);

  // ---- REAL 3D SPACE: each layer moves at its own speed, that's what sells depth ----
  const yaw = -P*Math.PI*0.55 - px*0.25;
  const pit = 0.02 + py*0.05;
  skyGroup.rotation.y  = yaw*0.15;  skyGroup.rotation.x  = pit*0.4;    // near-still
  // video plane doesn't rotate horizontally — its own drone footage handles the motion.
  // instead, drift it forward/back on Z with scroll to reinforce "we're flying too"
  if(farGroup.userData.plane){
    farGroup.userData.plane.position.z = -55 + P*8;                    // moves a touch closer as you scroll
  }
  foreGroup.rotation.y = yaw*1.40;  foreGroup.rotation.x = pit*1.1;    // fastest, closest

  // droplets drift on their own — small breathing so they feel alive in the volume
  const tSec = performance.now()*0.001;
  for(let i=0;i<droplets.length;i++){
    const d=droplets[i], b=d.userData.base;
    d.position.x = b.x + Math.sin(tSec*0.35 + d.userData.seed)*0.35;
    d.position.y = b.y + Math.cos(tSec*0.28 + d.userData.seed*1.7)*0.28;
    d.rotation.y = tSec*0.12 + d.userData.seed;
  }
  // light shafts: subtle intensity breathing so they never look static
  shafts[0].material.opacity = 0.10 + Math.sin(tSec*0.6)*0.05;
  shafts[1].material.opacity = 0.09 + Math.cos(tSec*0.5)*0.05;

  // atmospheric motes drift slowly
  {
    const pa=moteGeo.attributes.position.array;
    for(let i=0;i<MOTES;i++){
      const s=moteState[i];
      s.a += s.sp*0.005;
      pa[i*3]   = Math.cos(s.a)*s.r;
      pa[i*3+1] = s.y + Math.sin(tSec*0.4 + s.ph)*0.25;
      pa[i*3+2] = Math.sin(s.a)*s.r - 2;
    }
    moteGeo.attributes.position.needsUpdate=true;
  }

  // (3) light sweep across the logo right after it solidifies
  if(name==='logo'){
    const s=Math.max(0,Math.min(1,f*1.25));
    sweep.position.set(-4.2+8.4*s, 1.1, 2.4);
    sweep.intensity = Math.sin(Math.PI*s)*22;
  } else { sweep.intensity*=0.85; }

  // (4) peak: white flash + outward burst the instant the logo breaks apart
  if(P<0.20) flashed=false;
  if(name==='dissolve' && !flashed){ flashed=true;
    flashEl.style.opacity='0.85';
    setTimeout(()=>{ flashEl.style.transition='opacity .55s ease'; flashEl.style.opacity='0'; },90);
  }

  // (6) ambient dust
  updateDust(time);

  const ry=(REDUCED?0:Math.sin(time*0.4)*0.45) + px*0.7 + manual;
  const rx=-0.05 + Math.sin(time*0.3)*0.05 - py*0.25;
  wrap.rotation.y=ry; wrap.rotation.x=rx;
  reflWrap.rotation.y=ry; reflWrap.rotation.x=-rx;
  points.rotation.y = (name==='settle'||name==='crystal') ? Math.sin(time*0.25)*0.10 + px*0.25 : ry*0.35;
  iconsGroup.rotation.y = Math.sin(time*0.32)*0.30 + px*0.45;
  iconsGroup.rotation.x = -0.10 + Math.sin(time*0.24)*0.06 - py*0.18;
  syncIconReflections();

  renderer.render(scene,camera);

  // ---- project icon centers -> position the clickable labels (guarded: must never block render) ----
  try{
    if(name==='crystal'||name==='settle'){
      const showLbl=(iconOp>0.5);
      lblWA.classList.toggle('on',showLbl);
      lblIG.classList.toggle('on',showLbl);
      ripWA.classList.toggle('on',showLbl);
      ripIG.classList.toggle('on',showLbl);
      const toScreen=(wx,wy)=>{
        v3.set(wx*rootScale, wy*rootScale+root.position.y, 0).project(camera);
        return [(v3.x*0.5+0.5)*innerWidth, (-v3.y*0.5+0.5)*innerHeight];
      };
      // ripple size follows the on-screen size of an icon
      const [cxA,cyA]=toScreen(ORB_X,ORB_Y);
      const [cxB,cyB]=toScreen(ORB_X+ORB_H*0.5,ORB_Y);
      const RIP_MAX=1.42;                       // must match the max scale in @keyframes rip
      const ringPx=Math.max(70,Math.abs(cxB-cxA)*1.95);
      [[ripWA,ORB_X],[ripIG,-ORB_X]].forEach(([el,x])=>{
        const [sx,sy]=toScreen(x,ORB_Y);
        // never let the largest ring cross the viewport edge
        const room=Math.min(sx,innerWidth-sx)-6;
        const fit=Math.max(56,(room*2)/RIP_MAX);
        el.style.left=sx+'px'; el.style.top=sy+'px';
        el.style.setProperty('--rs',Math.min(ringPx,fit)+'px');
      });
      // badges: centred just above each icon, clamped so they never clip off-screen
      [[lblWA,ORB_X],[lblIG,-ORB_X]].forEach(([el,x])=>{
        const [sx,sy]=toScreen(x,ORB_Y+ORB_H*0.62);
        const halfW=(el.offsetWidth||90)/2, pad=8;
        el.style.left=Math.min(innerWidth-halfW-pad,Math.max(halfW+pad,sx))+'px';
        el.style.top=sy+'px';
      });
    }else{ lblWA.classList.remove('on'); lblIG.classList.remove('on');
           ripWA.classList.remove('on'); ripIG.classList.remove('on'); }
  }catch(err){ if(!window.__lblErr){console.warn('[BAGLIL] label projection error',err);window.__lblErr=1;} }

  if(!booted){ booted=true;
    const b=document.getElementById('boot');
    if(b) requestAnimationFrame(()=>b.classList.add('gone'));
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
