  :root{--pink:#E5489F;--cream:#F4ECDF}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{margin:0;background:#FBF7F0;overscroll-behavior-y:none}
  #spacer{width:1px;pointer-events:none}
  #cue{position:fixed;left:0;right:0;bottom:calc(3vh + env(safe-area-inset-bottom));
     display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
     font-family:'Heebo',sans-serif;font-size:12px;letter-spacing:3px;color:rgba(229,72,159,.7);
     transition:opacity .6s ease}
  #cue.hide{opacity:0}
  #cue .arrow{width:20px;height:20px;border-right:2px solid rgba(229,72,159,.65);
     border-bottom:2px solid rgba(229,72,159,.65);transform:rotate(45deg);
     animation:cueBob 1.6s ease-in-out infinite}
  @keyframes cueBob{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}
     50%{transform:rotate(45deg) translate(4px,4px);opacity:1}}
  #scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#241318}
  #scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
     background:#FBF7F0;z-index:50;transition:opacity .5s ease}
  #boot.gone{opacity:0;pointer-events:none}
  .bootDot{width:9px;height:9px;border-radius:50%;background:var(--pink);opacity:.35;
     animation:bd 1.1s ease-in-out infinite}
  .bootDot:nth-child(2){animation-delay:.15s}
  .bootDot:nth-child(3){animation-delay:.3s}
  @keyframes bd{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
  #nogl{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;
     justify-content:center;gap:14px;padding:28px;text-align:center;background:#FBF7F0}
  #nogl.on{display:flex}
  #nogl h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;color:var(--pink);font-size:clamp(30px,8.5vw,56px);line-height:1.08;letter-spacing:-0.5px}
  #nogl p{font-family:'Heebo',sans-serif;color:rgba(229,72,159,.75);letter-spacing:3px;font-size:15px}
  .nglBtns{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:min(320px,86vw)}
  .nglBtn{font-family:'Heebo',sans-serif;font-weight:700;text-decoration:none;text-align:center;
     background:var(--pink);color:#fff;padding:15px 22px;border-radius:999px;
     box-shadow:0 10px 28px rgba(229,72,159,.3)}
  .nglBtn.alt{background:rgba(255,255,255,.9);color:var(--pink);border:1.6px solid var(--pink);box-shadow:none}
  @media (prefers-reduced-motion: reduce){
    .ripple i{animation:none;opacity:.45;transform:scale(1)}
    .bootDot{animation:none}
    #tag,#sub{transition:opacity .4s ease;filter:none;transform:none}
  }
  /* dark scrims for text readability over the photo — sit ABOVE the image (z-2) but BELOW the
     canvas/text (z-1), so the morph, logo, icons and headline all stay crisp on top. Center is
     left clear so the cheers stays visible. */
  #washTop{position:fixed;top:0;left:0;right:0;height:28vh;pointer-events:none;z-index:-1;
     background:linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,0) 100%)}
  #washBot{position:fixed;bottom:0;left:0;right:0;height:30vh;pointer-events:none;z-index:-1;
     background:linear-gradient(0deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.28) 60%, rgba(0,0,0,0) 100%)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:-1;
     background:radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(60% 55% at 50% 45%, rgba(255,255,255,.95), rgba(255,214,238,.55) 45%, rgba(255,214,238,0) 75%);
     transition:opacity .12s ease-out}
  /* headline sits BELOW the top logo on the first screen; TUNE this padding to align with the
     3D logo (which is placed by LOGO_Y/LOGO_W in the JS). On the CTA screen (.low) it lifts. */
  #ui{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;
     padding:calc(34vh + env(safe-area-inset-top)) 20px 0;pointer-events:none;text-align:center;
     transition:padding-top .9s cubic-bezier(.2,.8,.3,1)}
  #ui.low{padding-top:calc(16vh + env(safe-area-inset-top))}

     over the photo (bright + dark regions). Brand pink kept — it pops on this image. */
  #tag{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--pink);
     font-size:clamp(20px,4.5vw,32px);line-height:1.18;letter-spacing:-0.2px;
     opacity:0;transform:translateY(-8px);
     transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.25,1);
     text-shadow:0 1px 2px rgba(0,0,0,.6), 0 2px 12px rgba(0,0,0,.5), 0 4px 28px rgba(0,0,0,.42)}
  #sub{font-family:'Heebo',sans-serif;font-weight:500;color:rgba(229,72,159,.92);
     font-size:clamp(12px,3.2vw,16px);letter-spacing:4px;margin-top:10px;
     opacity:0;transform:translateY(-5px);
     transition:opacity .9s ease .3s,transform .9s ease .3s;
     text-shadow:0 1px 3px rgba(0,0,0,.65), 0 2px 14px rgba(0,0,0,.5)}
  #sub.show{opacity:1;transform:none}
  #tag.show{opacity:1;transform:none}
  .badge{position:fixed;left:0;top:0;transform:translate(-50%,-50%) scale(.9);opacity:0;
     pointer-events:none;display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;cursor:pointer;
     background:rgba(255,255,255,.92);border:1.5px solid rgba(229,72,159,.35);
     padding:6px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(229,72,159,.22);white-space:nowrap;
     backdrop-filter:blur(6px);
     transition:opacity .7s ease,transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .badge.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .badge.hot{transform:translate(-50%,-50%) scale(1.07)}
  .badge b{font-family:'Heebo',sans-serif;font-weight:700;color:var(--pink);font-size:clamp(14px,3.7vw,17px);line-height:1}
  .badge span{font-family:'Heebo',sans-serif;font-weight:500;color:rgba(229,72,159,.7);font-size:clamp(11px,2.9vw,13px);line-height:1}

  .ripple{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
     width:1px;height:1px;transition:opacity .8s ease}
  .ripple.on{opacity:1}
  .ripple i{position:absolute;left:50%;top:50%;width:var(--rs,120px);height:var(--rs,120px);
     margin-left:calc(var(--rs,120px)/-2);margin-top:calc(var(--rs,120px)/-2);
     border:2px solid rgba(229,72,159,.55);border-radius:50%;
     animation:rip 2.8s cubic-bezier(.2,.7,.3,1) infinite}
  .ripple i:nth-child(2){animation-delay:1.4s}
  @keyframes rip{
    0%{transform:scale(.62);opacity:0}
    18%{opacity:.75}
    100%{transform:scale(1.42);opacity:0}
  }

// generic area-weighted surface sampler over a list of {geo, matrix}
function sampleSurfaces(items, n){
  const out=new Float32Array(n*3);
  const tris=[]; let total=0;
  const vA=new THREE.Vector3(),vB=new THREE.Vector3(),vC=new THREE.Vector3(),ab=new THREE.Vector3(),ac=new THREE.Vector3(),cr=new THREE.Vector3();
  for(const it of items){
    const g=it.geo, pos=g.attributes.position, idx=g.index;
    const count = idx? idx.count : pos.count;
    for(let i=0;i<count;i+=3){
      const a= idx? idx.getX(i):i, b= idx? idx.getX(i+1):i+1, c= idx? idx.getX(i+2):i+2;
      vA.fromBufferAttribute(pos,a); vB.fromBufferAttribute(pos,b); vC.fromBufferAttribute(pos,c);
      ab.subVectors(vB,vA); ac.subVectors(vC,vA); cr.crossVectors(ab,ac);
      const area=cr.length()*0.5; if(area<=0) continue;
      total+=area; tris.push({it,a,b,c,cum:total});
    }
  }
  const v=new THREE.Vector3();
  for(let i=0;i<n;i++){
    const r=Math.random()*total;
    let lo=0,hi=tris.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(tris[mid].cum<r) lo=mid+1; else hi=mid; }
    const t=tris[lo], pos=t.it.geo.attributes.position;
    vA.fromBufferAttribute(pos,t.a); vB.fromBufferAttribute(pos,t.b); vC.fromBufferAttribute(pos,t.c);
    let u=Math.random(), w=Math.random(); if(u+w>1){u=1-u;w=1-w;}
    v.copy(vA).addScaledVector(ab.subVectors(vB,vA),u).addScaledVector(ac.subVectors(vC,vA),w);
    v.applyMatrix4(t.it.matrix);
    out[i*3]=v.x; out[i*3+1]=v.y; out[i*3+2]=v.z;
  }
  return out;
}

// Loaded via dynamic import inside try/catch: if any addon fails, composer stays null and the
// loop falls back to plain renderer.render — the page never blanks (protects the load KPI).
// Kill-switch: append ?nofx to the URL to disable all post-fx for debugging.
const FX_ON = !/[?&]nofx\b/.test(location.search);
const FX_MOBILE = Math.min(innerWidth,innerHeight) < 700 || /Mobi|Android/i.test(navigator.userAgent);
const FilmGradeShader = {
  uniforms:{
    tDiffuse:{value:null}, uTime:{value:0},
    uCA:{value:FX_MOBILE?0.0011:0.0016},   // chromatic aberration (subtle, edge-weighted)
    uGrain:{value:REDUCED?0.028:0.05},     // film grain strength
    uVignette:{value:0.26}, uContrast:{value:1.045}, uSat:{value:1.05}, uWarm:{value:0.018}
  },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:[
    'varying vec2 vUv;',
    'uniform sampler2D tDiffuse;',
    'uniform float uTime,uCA,uGrain,uVignette,uContrast,uSat,uWarm;',
    'float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }',
    'void main(){',
    '  vec2 uv=vUv; vec2 dir=uv-0.5; float d=dot(dir,dir);',
    '  vec2 off=dir*d*uCA*8.0;',              // radial CA, stronger toward the edges
    '  vec3 col;',
    '  col.r=texture2D(tDiffuse,uv+off).r;',
    '  col.g=texture2D(tDiffuse,uv).g;',
    '  col.b=texture2D(tDiffuse,uv-off).b;',
    '  col=(col-0.5)*uContrast+0.5;',          // gentle S-contrast
    '  float l=dot(col,vec3(0.299,0.587,0.114));',
    '  col=mix(vec3(l),col,uSat);',            // mild saturation
    '  col+=vec3(uWarm,uWarm*0.4,-uWarm*0.5)*smoothstep(0.5,1.0,l);', // warm highlights only
    '  float g=hash(uv*vec2(1920.0,1080.0)+fract(uTime));',
    '  col+=(g-0.5)*uGrain;',                  // film grain
    '  float vig=smoothstep(0.9,0.2,d*2.2);',
    '  col*=mix(1.0,vig,uVignette);',          // subtle vignette
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n')
};
(async()=>{
  if(!FX_ON){ console.log('[BAGLIL] post-fx disabled via ?nofx'); return; }
  try{
    const [{EffectComposer},{RenderPass},{UnrealBloomPass},{ShaderPass},{OutputPass}] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
    const comp=new EffectComposer(renderer);
    comp.setPixelRatio(FX_MOBILE?Math.min(devicePixelRatio,1.5):Math.min(devicePixelRatio,2)); // bloom cost scales with pixels; favor FPS on mobile
    comp.setSize(innerWidth,innerHeight);
    comp.addPass(new RenderPass(scene,camera));
    // bloom runs in linear HDR before tone mapping. The golden-hour sky sits ~0.62-0.70 luminance,
    // so threshold is kept ABOVE it (0.82) — only the additive glints, sun glow and specular
    // highlights bloom, the sky itself does not wash out. Conservative strength; easy to push later.
    const strength=FX_MOBILE?0.42:0.6, radius=0.55, threshold=0.82;
    comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),strength,radius,threshold));
    comp.addPass(new OutputPass());           // tone map + sRGB, BEFORE the film grade
    const grade=new ShaderPass(FilmGradeShader);
    comp.addPass(grade);                       // last pass -> renders to screen
    composer=comp; fxPass=grade;
    composer.setSize(innerWidth,innerHeight);
    console.log('[BAGLIL] post-fx ready (bloom + film grade)'+(FX_MOBILE?' [mobile-lite]':''));
  }catch(e){
    console.warn('[BAGLIL] post-fx unavailable — falling back to plain render:',e);
    composer=null; fxPass=null;
  }
})();

// present the frame: composed when post-fx is ready, otherwise plain (never blanks)
function present(){ if(composer){ composer.render(); } else { renderer.render(scene,camera); } }

// ---------- interaction ----------
let tx=0,ty=0,px=0,py=0,drag=false,lx=0,manual=0;
addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{ if(drag){manual+=(e.clientX-lx)*0.008;lx=e.clientX;}
  tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5; });
addEventListener('deviceorientation',e=>{ if(e.gamma!=null){
  tx=Math.max(-1,Math.min(1,e.gamma/45)); ty=Math.max(-1,Math.min(1,(e.beta-45)/45)); }});

// ---------- timeline ----------
// logo(4.0) -> dissolve(1.2) -> morph to orbs(1.5) -> orbs(2.5) -> morph back(1.5) -> reform(1.0)
// scroll-driven segments: [name, from, to] over progress 0..1
const SEG=[
  ['logo',     0.00, 0.28],
  ['dissolve', 0.28, 0.54],
  ['toOrbs',   0.54, 0.80],
  ['crystal',  0.80, 0.92],
  ['settle',   0.92, 1.01],
];
// --- scroll progress with smoothing, plus an idle auto-reveal so non-scrollers still see the CTA ---
const spacer=document.getElementById('spacer');
const SCROLL_SCREENS=2.5;
function sizeSpacer(){ spacer.style.height=Math.round(innerHeight*SCROLL_SCREENS)+'px'; }
sizeSpacer(); addEventListener('resize',sizeSpacer);
let prog=0, targetProg=0, userScrolled=false, lastInput=performance.now(), autoProg=0;
function readScroll(){
  const max=Math.max(1, document.documentElement.scrollHeight-innerHeight);
  targetProg=Math.min(1, Math.max(0, scrollY/max));
  if(scrollY>2){ userScrolled=true; lastInput=performance.now(); }
}
addEventListener('scroll',readScroll,{passive:true});
readScroll();

const ease=t=>t*t*(3-2*t);
const tagEl=document.getElementById('tag');
const lblWA=document.getElementById('orbWA'), lblIG=document.getElementById('orbIG');
const ripWA=document.getElementById('ripWA'), ripIG=document.getElementById('ripIG');
lblWA.addEventListener('click',()=>track('cta_click',{channel:'whatsapp',surface:'badge'}));
lblIG.addEventListener('click',()=>track('cta_click',{channel:'instagram',surface:'badge'}));
const v3=new THREE.Vector3();
const t0=performance.now();
let tagSwapped=false, flashed=false, booted=false, copyTimer=0;
const flashEl=document.getElementById('flash');
const cueEl=document.getElementById('cue');
const subEl=document.getElementById('sub');
setTimeout(()=>{tagEl.classList.add('show');subEl.classList.add('show');},350);

let _prevT=0;
function frame(){
  const time=(performance.now()-t0)/1000;
  const dt=Math.min(0.05,time-_prevT); _prevT=time;

  // ---- resolve progress: scroll drives it; if nobody ever scrolls, reveal the CTA anyway ----
  if(!userScrolled && (performance.now()-lastInput)>6000){
    autoProg=Math.min(1, autoProg + dt*0.22);          // ~4.5s to walk the whole sequence
  }
  const wanted=Math.max(targetProg, userScrolled?0:autoProg);
  prog += (wanted-prog)*0.09;                           // smoothing — raw scroll is jittery
  const P=Math.min(1,Math.max(0,prog));

  let name='settle', f=1;
  for(const s of SEG){ if(P<s[2]){ name=s[0]; f=Math.min(1,Math.max(0,(P-s[1])/(s[2]-s[1]))); break; } }

  // scroll cue fades out as soon as the journey starts
  cueEl.classList.toggle('hide', P>0.04);

  // ---- solid logo opacity vs particle opacity ----
  let logoOp=0, partOp=0, iconOp=0, mt=0, A=S_LOGO, B=S_LOGO, turbAmp=0;
  if(name==='logo'){ logoOp=1; }                              // logo is simply there from the first pixel
  else if(name==='dissolve'){ logoOp=1-ease(f); partOp=ease(f); turbAmp=ease(f)*0.30; }
  else if(name==='toOrbs'){ partOp=1; A=S_LOGO; B=S_ORBS; mt=ease(f); turbAmp=Math.sin(Math.PI*f)*0.24; }
  else if(name==='crystal'){ A=S_ORBS; B=S_ORBS; partOp=1-ease(f); iconOp=ease(f); }
  else { A=S_ORBS; B=S_ORBS; partOp=0; iconOp=1; }   // settle

  const logoLive=(name==='logo'||name==='dissolve');
  pink.opacity=logoOp; wrap.visible=logoLive && logoOp>0.01;
  reflMat.opacity=0.16*logoOp; reflWrap.visible=logoLive && logoOp>0.01;
  pMat.opacity=partOp; points.visible=partOp>0.01;
  iconMat.opacity=iconOp; glyphMat.opacity=iconOp; iconsGroup.visible=iconOp>0.01;
  iconReflMat.opacity=iconOp*0.075;
  iconsLive = (name==='settle' && iconOp>0.9);
  updateFireflies(dt, iconOp);
  // gentle "tap me" pulse + hover lift
  const pulse=1+Math.sin(time*1.9)*0.035;
  hoverWA += (((hovered==='wa')?1:0)-hoverWA)*0.15;
  hoverIG += (((hovered==='ig')?1:0)-hoverIG)*0.15;
  waIcon.group.scale.setScalar(pulse*(1+hoverWA*0.14));
  igIcon.group.scale.setScalar(pulse*(1+hoverIG*0.14));
  lblWA.classList.toggle('hot',hoverWA>0.5);
  lblIG.classList.toggle('hot',hoverIG>0.5);
  // headline set follows scroll in BOTH directions
  const wantEnd = P>0.86;
  if(wantEnd!==tagSwapped){
    tagSwapped=wantEnd;
    document.getElementById('ui').classList.toggle('low',wantEnd);
    tagEl.classList.remove('show'); subEl.classList.remove('show');
    clearTimeout(copyTimer);
    copyTimer=setTimeout(()=>{
      tagEl.textContent = wantEnd ? 'אל תפספסו את האירוע הבא' : 'האירועים הכי שווים בגליל';
      subEl.textContent = wantEnd ? 'בחרו איך להצטרף'        : 'יין | מוזיקה | חופש';
      tagEl.classList.add('show'); subEl.classList.add('show');
    },420);
  }

  // ---- particle positions ----
  if(partOp>0.01){
    const p=pGeo.attributes.position.array;
    for(let k=0;k<N;k++){ const j=k*3;
      let x=A[j]+(B[j]-A[j])*mt, y=A[j+1]+(B[j+1]-A[j+1])*mt, z=A[j+2]+(B[j+2]-A[j+2])*mt;
      if(turbAmp){ x+=turb[j]*turbAmp; y+=turb[j+1]*turbAmp; z+=turb[j+2]*turbAmp; }
      p[j]=x; p[j+1]=y; p[j+2]=z;
    }
    pGeo.attributes.position.needsUpdate=true;
  }

  // ---- motion ----
  px+=(tx-px)*0.06; py+=(ty-py)*0.06;

  // (2) slow cinematic camera push over the first ~9s
  const pushT=REDUCED?1:P;
  camera.position.z = CAM_BASE + 0.95*(1-pushT*pushT*(3-2*pushT));
  camera.position.x = px*0.4; camera.position.y = 0.25 - py*0.3;
  camera.lookAt(0,root.position.y*0.5,0);

  // ---- background layers removed; the hero photo carries the scene, ambient dust drifts over it ----

  // (3) light sweep across the logo right after it solidifies
  if(name==='logo'){
    const s=Math.max(0,Math.min(1,f*1.25));
    sweep.position.set(-4.2+8.4*s, 1.1, 2.4);
    sweep.intensity = Math.sin(Math.PI*s)*22;
  } else { sweep.intensity*=0.85; }

  // (4) peak: white flash + outward burst the instant the logo breaks apart
  if(P<0.20) flashed=false;
  if(name==='dissolve' && !flashed){ flashed=true;
    flashEl.style.opacity='0.85';
    setTimeout(()=>{ flashEl.style.transition='opacity .55s ease'; flashEl.style.opacity='0'; },90);
  }

  // (6) ambient dust
  updateDust(time);

  const ry=(REDUCED?0:Math.sin(time*0.4)*0.45) + px*0.7 + manual;
  const rx=-0.05 + Math.sin(time*0.3)*0.05 - py*0.25;
  wrap.rotation.y=ry; wrap.rotation.x=rx;
  reflWrap.rotation.y=ry; reflWrap.rotation.x=-rx;
  points.rotation.y = (name==='settle'||name==='crystal') ? Math.sin(time*0.25)*0.10 + px*0.25 : ry*0.35;
  iconsGroup.rotation.y = Math.sin(time*0.32)*0.30 + px*0.45;
  iconsGroup.rotation.x = -0.10 + Math.sin(time*0.24)*0.06 - py*0.18;
  syncIconReflections();

  // drive film grain (frozen under reduced-motion so it doesn't shimmer)
  if(fxPass) fxPass.uniforms.uTime.value = REDUCED ? 0 : time;
  present();

  // ---- project icon centers -> position the clickable labels (guarded: must never block render) ----
  try{
    if(name==='crystal'||name==='settle'){
      const showLbl=(iconOp>0.5);
      lblWA.classList.toggle('on',showLbl);
      lblIG.classList.toggle('on',showLbl);
      ripWA.classList.toggle('on',showLbl);
      ripIG.classList.toggle('on',showLbl);
      const toScreen=(wx,wy)=>{
        v3.set(wx*rootScale, wy*rootScale+root.position.y, 0).project(camera);
        return [(v3.x*0.5+0.5)*innerWidth, (-v3.y*0.5+0.5)*innerHeight];
      };
      // ripple size follows the on-screen size of an icon
      const [cxA,cyA]=toScreen(ORB_X,ORB_Y);
      const [cxB,cyB]=toScreen(ORB_X+ORB_H*0.5,ORB_Y);
      const RIP_MAX=1.42;                       // must match the max scale in @keyframes rip
      const ringPx=Math.max(70,Math.abs(cxB-cxA)*1.95);
      [[ripWA,ORB_X],[ripIG,-ORB_X]].forEach(([el,x])=>{
        const [sx,sy]=toScreen(x,ORB_Y);
        // never let the largest ring cross the viewport edge
        const room=Math.min(sx,innerWidth-sx)-6;
        const fit=Math.max(56,(room*2)/RIP_MAX);
        el.style.left=sx+'px'; el.style.top=sy+'px';
        el.style.setProperty('--rs',Math.min(ringPx,fit)+'px');
      });
      // badges: centred just above each icon, clamped so they never clip off-screen
      [[lblWA,ORB_X],[lblIG,-ORB_X]].forEach(([el,x])=>{
        const [sx,sy]=toScreen(x,ORB_Y+ORB_H*0.62);
        const halfW=(el.offsetWidth||90)/2, pad=8;
        el.style.left=Math.min(innerWidth-halfW-pad,Math.max(halfW+pad,sx))+'px';
        el.style.top=sy+'px';
      });
    }else{ lblWA.classList.remove('on'); lblIG.classList.remove('on');
           ripWA.classList.remove('on'); ripIG.classList.remove('on'); }
  }catch(err){ if(!window.__lblErr){console.warn('[BAGLIL] label projection error',err);window.__lblErr=1;} }

  if(!booted){ booted=true;
    const b=document.getElementById('boot');
    if(b) requestAnimationFrame(()=>b.classList.add('gone'));
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
